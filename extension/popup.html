<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
body{width:300px;margin:0;padding:16px;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;color:#1a1a17;background:#fafaf7}
h1{font-size:17px;margin:0 0 6px}
p{margin:0 0 10px;color:#6b6b64}
label{display:block;font-size:13px;color:#6b6b64;margin:0 0 4px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #e3e2dc;border-radius:8px;font:inherit}
button{margin-top:10px;width:100%;padding:10px;border:0;border-radius:8px;background:#1a1a17;color:#fff;font:inherit;font-weight:600;cursor:pointer}
#msg{margin-top:8px;min-height:20px}
a{color:#1a1a17}
</style>
</head>
<body>
<h1>TruePaid</h1>
<p>Open any payment on explorer.arc.io and TruePaid shows if real USDC reached you, or a fake token with the same name.</p>
<label for="seller">Your Arc address</label>
<input id="seller" placeholder="0x..." autocomplete="off" spellcheck="false">
<button id="save">Save</button>
<p id="msg"></p>
<p><a href="https://truepaid.vercel.app" target="_blank" rel="noopener">Check a payment on the website</a></p>
<script src="popup.js"></script>
</body>
</html>
